# Local development only: the database credentials below are local defaults.
# Production uses managed databases and Key Vault/Container App secret refs.
services:
  postgres:
    image: postgres:16-alpine
    container_name: webflowai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webflowai
      POSTGRES_PASSWORD: webflowai
      POSTGRES_DB: webflowai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - webflowai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webflowai -d webflowai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: webflowai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - webflowai-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
    container_name: webflowai-app
    restart: unless-stopped
    init: true
    user: "1001:1001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=1770
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,uid=1001,gid=1001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://webflowai:webflowai@postgres:5432/webflowai?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  webflowai-pgdata:
  webflowai-redisdata:
