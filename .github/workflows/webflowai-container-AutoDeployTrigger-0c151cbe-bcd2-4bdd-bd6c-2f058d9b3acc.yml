name: Trigger auto deployment for webflowai-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ azure ]
    paths:
    - '**'
    - '.github/workflows/webflowai-container-AutoDeployTrigger-0c151cbe-bcd2-4bdd-bd6c-2f058d9b3acc.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WEBFLOWAICONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WEBFLOWAICONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WEBFLOWAICONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.WEBFLOWAICONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WEBFLOWAICONTAINER_REGISTRY_PASSWORD }}
          containerAppName: webflowai-container
          resourceGroup: webflowai
          imageToBuild: lav1shkumar/webflowai-container:${{ github.sha }}
          buildArguments: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in


